<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      padding: 16px;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
    }
    h3 {
      margin: 0 0 12px 0;
      font-size: 14px;
      font-weight: 600;
    }
    select {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #45475a;
      background: #313244;
      color: #cdd6f4;
      font-size: 13px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: none;
      background: #89b4fa;
      color: #1e1e2e;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #74a8f9; }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #a6e3a1;
      text-align: center;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <h3>TZ Spoof</h3>
  <select id="tzSelect">
    <option value="Europe/Helsinki">Europe/Helsinki</option>
    <option value="Europe/Moscow">Europe/Moscow</option>
    <option value="Europe/London">Europe/London</option>
    <option value="Europe/Berlin">Europe/Berlin</option>
    <option value="Europe/Kyiv">Europe/Kyiv</option>
    <option value="America/New_York">America/New_York</option>
    <option value="America/Los_Angeles">America/Los_Angeles</option>
    <option value="Asia/Dubai">Asia/Dubai</option>
    <option value="Asia/Tokyo">Asia/Tokyo</option>
  </select>
  <button id="saveBtn">Сhange</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
